services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swing_trading
      POSTGRES_USER: swing
      POSTGRES_PASSWORD: swing
    ports:
      - "5432:5432"
    volumes:
      - swing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swing -d swing_trading"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  swing_postgres_data:
